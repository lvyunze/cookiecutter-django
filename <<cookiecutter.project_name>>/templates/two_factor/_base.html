<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Two-Factor Authentication{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen font-sans">

  <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-xl shadow-lg">
    
    <div class="text-center">
        <h2 class="text-2xl font-bold text-gray-900">{% block title_h2 %}{% endblock %}</h2>
    </div>

    {% if messages %}
      <div class="space-y-3">
      {% for message in messages %}
        <div class="p-4 text-sm rounded-lg {% if message.tags == 'error' %}bg-red-100 text-red-800{% elif message.tags == 'success' %}bg-green-100 text-green-800{% else %}bg-blue-100 text-blue-800{% endif %}" role="alert">
          <span class="font-medium">{{ message }}</span>
        </div>
      {% endfor %}
      </div>
    {% endif %}
    
    <div class="space-y-6">
        {% block content %}
        {% endblock %}
    </div>

  </div>

</body>
</html>
