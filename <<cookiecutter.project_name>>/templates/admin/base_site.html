{% extends "admin/base_site.html" %}
{% load i18n %}

{% block userlinks %}
    {% if request.user.totpdevice_set.exists %}
        <span class="ml-3" style="color: beige;">✓ Two-factor authentication enabled</span>
    {% else %}
        <a href="{% url 'two_factor:setup' %}" class="ml-3">
            <span style="color: red;">⚠ Setup Two-Factor Authentication</span>
        </a>
    {% endif %} /
    {{ block.super }}
{% endblock %}
